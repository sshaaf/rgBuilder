[package]
name = "rgbuilder-macros"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for rgBuilder language plugins"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
rgbuilder-plugin-api = { path = "../crates/rgbuilder-plugin-api" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[package]
name = "rgbuilder-gql"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Graph query language for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-analysis = { path = "../rgbuilder-analysis" }
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
petgraph = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

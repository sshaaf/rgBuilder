[package]
name = "rgbuilder-export"
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
description = "Graph export and visualization for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

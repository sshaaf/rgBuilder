[package]
name = "rgbuilder-project-config"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Project configuration analysis for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-extraction = { path = "../rgbuilder-extraction" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
rgbuilder-registry = { path = "../rgbuilder-registry" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

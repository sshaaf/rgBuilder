[package]
name = "rgbuilder-extraction"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Code extraction layer for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
rgbuilder-plugin-helpers = { path = "../rgbuilder-plugin-helpers" }
rgbuilder-registry = { path = "../rgbuilder-registry" }
ignore = "0.4"
rayon = "1.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }
rgbuilder-languages = { workspace = true }

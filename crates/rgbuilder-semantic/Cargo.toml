[package]
name = "rgbuilder-semantic"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Semantic analysis and IDL generation for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
handlebars = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

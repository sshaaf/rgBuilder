[package]
name = "rgbuilder-registry"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
description = "Language plugin registry for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-config-formats = { path = "../rgbuilder-config-formats" }
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }

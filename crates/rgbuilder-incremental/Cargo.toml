[package]
name = "rgbuilder-incremental"
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
description = "Incremental graph updates for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-analysis = { path = "../rgbuilder-analysis" }
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-extraction = { path = "../rgbuilder-extraction" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
rgbuilder-pipeline = { path = "../rgbuilder-pipeline" }
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
rgbuilder-project-config = { path = "../rgbuilder-project-config" }
rgbuilder-registry = { path = "../rgbuilder-registry" }
blake3 = "1"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }
rgbuilder-languages = { workspace = true }

[package]
name = "rgbuilder-rules"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
description = "Rule engine for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

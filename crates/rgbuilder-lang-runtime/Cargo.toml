[package]
name = "rgbuilder-lang-runtime"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Generic tree-sitter and regex language plugins for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-plugin-api = { path = "../rgbuilder-plugin-api" }
rgbuilder-plugin-helpers = { path = "../rgbuilder-plugin-helpers" }
regex = "1"
serde_json = "1"
tree-sitter = "0.25"

[dev-dependencies]
tree-sitter-c = "0.24"

[package]
name = "rgbuilder-dashboard"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Static dashboard bundle export for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-analysis = { path = "../rgbuilder-analysis" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
memmap2 = "0.9"
rayon = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

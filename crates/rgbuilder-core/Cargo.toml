rgbuilder-registry = { path = "../rgbuilder-registry" }
rgbuilder-rules = { path = "../rgbuilder-rules" }
rgbuilder-security = { path = "../rgbuilder-security" }
rgbuilder-semantic = { path = "../rgbuilder-semantic" }

sysinfo = "0.30"

[features]
default = []

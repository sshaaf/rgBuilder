[package]
name = "rgbuilder-security"
version = "0.4.6"
edition.workspace = true
rust-version.workspace = true
description = "Security analysis for rgBuilder"
license = "MIT OR Apache-2.0"

[dependencies]
rgbuilder-analysis = { path = "../rgbuilder-analysis" }
rgbuilder-error = { path = "../rgbuilder-error" }
rgbuilder-graph = { path = "../rgbuilder-graph" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
